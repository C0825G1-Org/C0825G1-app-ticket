<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/layout :: head('Đặt vé thành công')}"></head>

<body>
    <div th:replace="~{common/layout :: user-layout(~{:: .booking-success})}">
        <div class="booking-success container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-5">
                            <div class="mb-4">
                                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                            </div>
                            <h2 class="mb-3">Đặt vé thành công!</h2>
                            <p class="text-muted mb-4">Cảm ơn bạn đã sử dụng dịch vụ của chúng tôi. Bạn có thể xem vé
                                của mình trong mục "Vé của tôi".</p>

                            <div class="card bg-light border-0 mb-4">
                                <div class="card-body text-start">
                                    <p class="mb-1"><strong>Mã đơn hàng:</strong> #<span th:text="${booking.id}"></span>
                                    </p>
                                    <p class="mb-1"><strong>Trạng thái:</strong> <span class="badge bg-success"
                                            th:text="${booking.status}"></span></p>
                                    <p class="mb-0"><strong>Ngày đặt:</strong> <span
                                            th:text="${#temporals.format(booking.bookingTime, 'dd/MM/yyyy HH:mm')}"></span>
                                    </p>
                                </div>
                            </div>

                            <div class="mb-4 text-start">
                                <h5 class="mb-3">Vé của bạn:</h5>
                                <div class="row row-cols-1 row-cols-md-2 g-3">
                                    <div th:each="ticket : ${tickets}" class="col">
                                        <div class="card h-100 border-dashed">
                                            <div class="card-body text-center p-3">
                                                <img th:src="'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + ${ticket.ticketCode}"
                                                    alt="QR Code" class="img-fluid mb-2" style="width: 120px;">
                                                <div class="small fw-bold"
                                                    th:text="${ticket.bookingDetail.ticketType.name}"></div>
                                                <code class="text-muted small" th:text="${ticket.ticketCode}"></code>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <a th:href="@{/tickets/my-tickets}" class="btn btn-primary">Xem vé của tôi</a>
                                <a th:href="@{/}" class="btn btn-outline-secondary">Về trang chủ</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
