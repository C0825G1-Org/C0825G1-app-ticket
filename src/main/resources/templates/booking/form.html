<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/layout :: head('Đặt vé')}"></head>

<body style="background-color: #0f172a;" data-bs-theme="dark">
    <div th:replace="~{common/layout :: user-layout(~{:: .booking-form})}">
        <div class="booking-form container py-5" style="margin-top: 80px;">
            <div class="row justify-content-center"
                th:with="ticketMap=${event.eventMedias.^[mediaPurpose.name() == 'TICKET_MAP']}">

                <!-- Left Column: Seat Map (Optional) -->
                <div class="col-lg-5 mb-4 mb-lg-0" th:if="${ticketMap != null}">
                    <div class="card card-glass-dark border-0 h-100 sticky-top" style="top: 100px; z-index: 1;">
                        <div class="card-header bg-transparent border-0 py-3">
                            <h5 class="fw-bold mb-0">Sơ đồ vé</h5>
                        </div>
                        <div class="card-body text-center">
                            <img th:src="${ticketMap.mediaUrl}" class="img-fluid rounded-3" alt="Sơ đồ vé">
                        </div>
                    </div>
                </div>

                <!-- Right Column: Booking Form -->
                <div th:class="${ticketMap != null ? 'col-lg-7' : 'col-md-8'}">
                    <div class="card card-glass-dark border-0">
                        <div class="card-body p-4">
                            <h2 class="mb-4 text-white" th:text="${event.title}">Tên sự kiện</h2>
                            <p class="text-white-50" th:text="${location}"><i class="bi bi-geo-alt"></i> Địa điểm</p>
                            <hr>

                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                                <span th:text="${error}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"
                                    aria-label="Close"></button>
                            </div>
                            <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show"
                                role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span th:text="${warning}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"
                                    aria-label="Close"></button>
                            </div>

                            <form th:action="@{/bookings/confirm}" method="post" id="bookingForm">
                                <input type="hidden" name="eventId" th:value="${event.id}">

                                <h5 class="mb-3">Chọn loại vé:</h5>
                                <th:block th:each="tt, stat : ${ticketTypes}">
                                    <!-- Header: Show only if first item OR occurrenceId changed -->
                                    <div th:if="${stat.first or tt.eventOccurrence.id != ticketTypes[stat.index - 1].eventOccurrence.id}"
                                        class="alert alert-soft-info mt-4 mb-2 d-flex align-items-center text-white bg-dark border border-secondary border-opacity-50">
                                        <i class="bi bi-calendar-event me-2 text-info"></i>
                                        <div>
                                            <strong
                                                th:text="${#temporals.format(tt.eventOccurrence.startTime, 'HH:mm - dd/MM/yyyy')}"></strong>
                                            <span class="mx-2">|</span>
                                            <span
                                                th:text="${tt.eventOccurrence.location.ward.province.name + ', ' + tt.eventOccurrence.location.ward.name}"></span>
                                        </div>
                                    </div>

                                    <div
                                        class="mb-3 p-3 border border-secondary border-opacity-25 rounded bg-transparent">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="mb-0 text-white" th:text="${tt.name}">Tên vé</h6>
                                                <small class="text-primary fw-bold"
                                                    th:text="${#numbers.formatDecimal(tt.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></small>
                                                <br>
                                                <small class="text-white-50"
                                                    th:text="'Còn lại: ' + ${ticketAvailability[tt.id]}"></small>
                                            </div>
                                            <div style="width: 100px;">
                                                <input type="number" th:name="'ticket_' + ${tt.id}"
                                                    class="form-control ticket-qty bg-dark text-white border-secondary border-opacity-50"
                                                    th:value="${preSelectedQuantities != null and preSelectedQuantities.containsKey(tt.id) ? preSelectedQuantities.get(tt.id) : ''}"
                                                    placeholder="0" min="0" th:max="${ticketAvailability[tt.id]}">
                                            </div>
                                        </div>
                                    </div>
                                </th:block>

                                <div id="ticketCountError" class="alert alert-warning py-2 mb-3 d-none">
                                    <i class="bi bi-exclamation-circle me-2"></i>
                                    Vui lòng chọn ít nhất một vé để tiếp tục.
                                </div>

                                <div class="d-grid gap-2 mt-4">
                                    <button type="submit" class="btn btn-gradient btn-lg fw-bold text-white"
                                        style="background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); border: none;">Tiếp
                                        tục đặt vé</button>
                                    <a th:href="@{/event/{id}(id=${event.id})}" class="btn btn-outline-light">Quay
                                        lại</a>
                                </div>
                            </form>

                            <script th:inline="javascript">
                                /*<![CDATA[*/
                                document.getElementById('bookingForm').addEventListener('submit', function (e) {
                                    let total = 0;
                                    const errorDiv = document.getElementById('ticketCountError');

                                    document.querySelectorAll('.ticket-qty').forEach(input => {
                                        total += parseInt(input.value) || 0;
                                    });

                                    if (total <= 0) {
                                        e.preventDefault();
                                        errorDiv.classList.remove('d-none');
                                        errorDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    } else {
                                        errorDiv.classList.add('d-none');
                                    }
                                });
                                /*]]>*/
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
