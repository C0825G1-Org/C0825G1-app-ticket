<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa hồ sơ - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{common/styles :: styles}"></th:block>
    <style>
        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{common/user-header :: user-navbar}"></div>

    <!-- Main Content -->
    <div class="container-xl py-5" style="margin-top: 80px;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Chỉnh sửa hồ sơ</h2>
            <a th:href="@{/user/profile}" class="btn btn-outline-secondary rounded-3">
                <i class="bi bi-arrow-left me-2"></i>Quay lại
            </a>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <!-- Avatar Section -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 text-center">
                        <img th:src="'https://ui-avatars.com/api/?name=' + ${user.fullName} + '&size=150&background=7c3aed&color=fff'"
                            class="profile-avatar mb-4" alt="Avatar">
                        <h5 class="fw-bold" th:text="${user.fullName}">Nguyễn Văn A</h5>
                        <p class="text-muted small" th:text="${user.email}">email@example.com</p>
                        <hr>
                        <form th:action="@{/user/profile/avatar}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Thay đổi ảnh đại diện</label>
                                <input type="file" name="avatar" class="form-control" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-outline-primary rounded-3 w-100">
                                <i class="bi bi-camera me-2"></i>Cập nhật ảnh
                            </button>
                        </form>
                        <small class="text-muted d-block mt-2">Kích thước tối đa: 2MB. Định dạng: JPG, PNG</small>
                    </div>
                </div>
            </div>

            <!-- Edit Form Section -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-white border-bottom py-3 px-4">
                        <h5 class="fw-bold mb-0">Thông tin cá nhân</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/user/profile/edit}" th:object="${user}" method="post">
                            <div class="row g-4">
                                <div class="col-12">
                                    <label class="form-label fw-bold">Họ và tên <span
                                            class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fullName}"
                                        class="form-control form-control-lg rounded-3" required>
                                    <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small"
                                        th:errors="*{fullName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="email" th:field="*{email}"
                                        class="form-control form-control-lg rounded-3" readonly disabled>
                                    <small class="text-muted">Email không thể thay đổi</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Số điện thoại</label>
                                    <input type="tel" th:field="*{phoneNumber}"
                                        class="form-control form-control-lg rounded-3">
                                    <div th:if="${#fields.hasErrors('phoneNumber')}" class="text-danger small"
                                        th:errors="*{phoneNumber}"></div>
                                </div>
                            </div>
                            <div class="mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-gradient btn-lg px-5 rounded-3">
                                    <i class="bi bi-check-circle me-2"></i>Lưu thay đổi
                                </button>
                                <a th:href="@{/user/profile}"
                                    class="btn btn-outline-secondary btn-lg px-4 rounded-3 ms-2">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
