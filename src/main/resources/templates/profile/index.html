<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        :root {
            --primary-color: #7c3aed;
            --secondary-color: #db2777;
            --dark-color: #0f172a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: var(--dark-color);
        }

        .navbar-glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            object-fit: cover;
        }

        .stat-card {
            border: none;
            border-radius: 1rem;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .nav-pills .nav-link {
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: #64748b;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-pills .nav-link:hover {
            background-color: #f1f5f9;
            color: var(--dark-color);
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(124, 58, 237, 0.15);
        }

        .btn-gradient {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            transition: transform 0.2s;
        }

        .btn-gradient:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <!-- Navbar -->
    <div th:replace="~{common/header :: public-navbar}"></div>

    <!-- Main Content -->
    <div class="container-xl py-5" style="margin-top: 80px;">

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Profile Header -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <div class="row align-items-center">
                    <div class="col-md-auto text-center text-md-start mb-3 mb-md-0">
                        <img th:src="@{'https://ui-avatars.com/api/?name=' + ${user.fullName} + '&size=120&background=7c3aed&color=fff'}"
                            class="profile-avatar" alt="Avatar">
                    </div>
                    <div class="col-md">
                        <h3 class="fw-bold mb-2" th:text="${user.fullName}">Nguyễn Văn A</h3>
                        <p class="text-muted mb-3">
                            <i class="bi bi-envelope me-2"></i><span th:text="${user.email}">nguyenvana@gmail.com</span>
                        </p>
                        <!-- Account Status Hidden as requested -->
                    </div>
                    <div class="col-md-auto mt-3 mt-md-0">
                        <!-- Avatar change removed for now as backend support not explicit in task -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-4 mb-4">
            <!-- Ticket Count -->
            <div class="col-md-4">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted mb-1 small">Vé đã mua</p>
                                <h3 class="fw-bold mb-0" th:text="${user.ticketCount}">0</h3>
                            </div>
                            <div class="bg-primary-subtle text-primary rounded-circle p-3">
                                <i class="bi bi-ticket-perforated fs-4"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Event Count -->
            <div class="col-md-4">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted mb-1 small">Sự kiện đã tạo</p>
                                <h3 class="fw-bold mb-0" th:text="${user.eventCount}">0</h3>
                            </div>
                            <div class="bg-success-subtle text-success rounded-circle p-3">
                                <i class="bi bi-calendar-check fs-4"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Total Spent -->
            <div class="col-md-4">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted mb-1 small">Tổng chi tiêu</p>
                                <h3 class="fw-bold mb-0" th:text="${user.totalSpent}">0đ</h3>
                            </div>
                            <div class="bg-warning-subtle text-warning rounded-circle p-3">
                                <i class="bi bi-cash-stack fs-4"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <ul class="nav nav-pills mb-4" id="profileTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="info-tab" data-bs-toggle="pill" data-bs-target="#info"
                            type="button">
                            <i class="bi bi-person me-2"></i>Thông tin cá nhân
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="password-tab" data-bs-toggle="pill" data-bs-target="#password"
                            type="button">
                            <i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="history-tab" data-bs-toggle="pill" data-bs-target="#history"
                            type="button">
                            <i class="bi bi-clock-history me-2"></i>Lịch sử hoạt động
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="profileTabsContent">
                    <!-- Personal Info Tab -->
                    <div class="tab-pane fade show active" id="info" role="tabpanel">
                        <form th:action="@{/profile/update}" th:object="${userProfileDTO}" method="post" novalidate>
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Họ và tên</label>
                                    <input type="text" class="form-control form-control-lg rounded-3"
                                        th:field="*{fullName}">
                                    <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"
                                        class="text-danger small mt-1"></div>
                                </div>
                                <!-- Email input removed from display, kept hidden for binding/validation -->
                                <input type="hidden" th:field="*{email}">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Số điện thoại</label>
                                    <input type="tel" class="form-control form-control-lg rounded-3"
                                        th:field="*{phoneNumber}">
                                    <div th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"
                                        class="text-danger small mt-1"></div>
                                </div>
                                <!-- Removed DOB and Address -->
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-gradient btn-lg px-5 rounded-3">
                                    <i class="bi bi-check-circle me-2"></i>
                                    Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Change Password Tab -->
                    <div class="tab-pane fade" id="password" role="tabpanel">

                        <form id="request-change-password-form">
                            <!-- Error Alert -->
                            <div id="passwordError" class="alert alert-danger d-none" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="passwordErrorText"></span>
                            </div>

                            <div class="row g-4">
                                <div class="col-12">
                                    <label class="form-label fw-bold">Mật khẩu hiện tại</label>
                                    <input type="password" id="currentPassword" name="currentPassword"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Nhập mật khẩu hiện tại" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Mật khẩu mới</label>
                                    <input type="password" id="newPassword" name="newPassword"
                                        class="form-control form-control-lg rounded-3" placeholder="Nhập mật khẩu mới"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Xác nhận mật khẩu mới</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Nhập lại mật khẩu mới" required>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="button" id="btnRequestChange"
                                    class="btn btn-gradient btn-lg px-5 rounded-3">
                                    <i class="bi bi-shield-lock me-2"></i>
                                    Đổi mật khẩu
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- OTP Modal -->
                    <div class="modal fade" id="otpModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content border-0 shadow-lg rounded-4">
                                <div class="modal-header border-0 pb-0">
                                    <h5 class="modal-title fw-bold">Xác thực OTP</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body pt-2">
                                    <p class="text-muted small mb-3">Mã OTP đã được gửi đến email của bạn. Vui lòng nhập
                                        mã để xác nhận đổi mật khẩu.</p>
                                    <input type="text" id="otpInput"
                                        class="form-control form-control-lg rounded-3 text-center letter-spacing-2"
                                        placeholder="NHẬP MÃ OTP (6 số)" maxlength="6">
                                    <!-- OTP Error -->
                                    <div id="otpError" class="text-danger small mt-2 text-center d-none"></div>
                                    <!-- OTP Success -->
                                    <div id="otpSuccess" class="text-success small mt-2 text-center d-none">
                                        <i class="bi bi-check-circle-fill me-1"></i>Đổi mật khẩu thành công! Đang chuyển
                                        hướng...
                                    </div>
                                </div>
                                <div class="modal-footer border-0 pt-0">
                                    <button type="button" class="btn btn-light rounded-3"
                                        data-bs-dismiss="modal">Hủy</button>
                                    <button type="button" id="btnConfirmOtp" class="btn btn-gradient rounded-3 px-4">Xác
                                        nhận</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Activity History Tab -->
                    <div class="tab-pane fade" id="history" role="tabpanel">
                        <div class="list-group list-group-flush" th:if="${not #lists.isEmpty(user.activities)}">
                            <div class="list-group-item px-0 py-3" th:each="activity : ${user.activities}">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <!-- Determine color/icon based on activity type -->
                                        <h6 class="fw-bold mb-1" th:text="${activity.action}">Action</h6>
                                        <p class="text-muted small mb-0" th:text="${activity.description}">Description
                                        </p>
                                    </div>
                                    <small class="text-muted"
                                        th:text="${#temporals.format(activity.timestamp, 'dd/MM/yyyy HH:mm')}">Time</small>
                                </div>
                            </div>
                        </div>
                        <div class="text-center py-4" th:if="${#lists.isEmpty(user.activities)}">
                            <p class="text-muted">Chưa có hoạt động nào được ghi nhận.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {
            // Setup CSRF for AJAX
            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            $(document).ajaxSend(function (e, xhr, options) {
                if (token && header) {
                    xhr.setRequestHeader(header, token);
                }
            });

            // Check if URL has hash (e.g. #password) to activate tab
            var hash = window.location.hash;
            if (hash) {
                var triggerEl = document.querySelector('#profileTabs button[data-bs-target="' + hash + '"]');
                if (triggerEl) {
                    var tab = new bootstrap.Tab(triggerEl);
                    tab.show();
                }
            }

            // Helper to show error
            function showPasswordError(msg) {
                $("#passwordErrorText").text(msg);
                $("#passwordError").removeClass("d-none");
            }

            function hidePasswordError() {
                $("#passwordError").addClass("d-none");
                $("#passwordErrorText").text("");
            }

            // Request Password Change
            $("#btnRequestChange").click(function () {
                var btn = $(this);
                hidePasswordError();

                var currentPassword = $("#currentPassword").val();
                var newPassword = $("#newPassword").val();
                var confirmPassword = $("#confirmPassword").val();

                // Client-side validation removed per request
                // Server will handle validation and return error messages

                btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...');

                $.post("/profile/password/otp", {
                    currentPassword: currentPassword,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                }, function (data) {
                    btn.prop('disabled', false).html('<i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu');
                    $("#otpError").addClass("d-none").text(""); // Clear previous OTP errors
                    $("#otpSuccess").addClass("d-none");

                    // Note: Since we expect ResponseEntity<?> now, data might be parsed JSON automatically or text
                    // If server returns ResponseEntity.ok("SUCCESS"), data is "SUCCESS" string.
                    // If JSON, it's object.

                    var otpModal = new bootstrap.Modal(document.getElementById('otpModal'));
                    otpModal.show();

                }).fail(function (xhr) {
                    btn.prop('disabled', false).html('<i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu');
                    var errorMsg = xhr.responseText || "Lỗi kết nối đến server!";
                    if (xhr.status === 403) {
                        errorMsg = "Lỗi bảo mật (CSRF). Vui lòng tải lại trang.";
                    }
                    showPasswordError(errorMsg);
                });
            });

            // Confirm OTP
            $("#btnConfirmOtp").click(function () {
                var btn = $(this);
                var otp = $("#otpInput").val();
                var newPassword = $("#newPassword").val();
                var confirmPassword = $("#confirmPassword").val();

                $("#otpError").addClass("d-none").text("");
                $("#otpSuccess").addClass("d-none");

                if (!otp) {
                    $("#otpError").removeClass("d-none").text("Vui lòng nhập mã OTP!");
                    return;
                }

                btn.prop('disabled', true).text('Đang xác thực...');

                $.post("/profile/password/change", {
                    otp: otp,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                }, function (data) {
                    // Success case
                    $("#otpSuccess").removeClass("d-none");
                    btn.text('Thành công!').addClass('btn-success').removeClass('btn-gradient');

                    // Delay redirect
                    setTimeout(function () {
                        window.location.href = "/login?logout";
                    }, 1500);

                }).fail(function (xhr) {
                    btn.prop('disabled', false).text('Xác nhận');
                    var errorMsg = xhr.responseText || "Lỗi xác thực!";
                    $("#otpError").removeClass("d-none").text(errorMsg);
                });
            });
        });
    </script>
</body>

</html>
