<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - AppTicket</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7c3aed;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>

<body>
    <div class="card auth-card shadow-lg rounded-4 border-0 p-4">
        <div class="card-body text-center">
            <div class="mb-4">
                <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-key-fill fs-2"></i>
                </div>
                <h4 class="fw-bold">Quên mật khẩu?</h4>
                <p class="text-muted small">
                    Nhập email của bạn và chúng tôi sẽ gửi mã xác thực để đặt lại mật khẩu.
                </p>
            </div>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-4 text-start">
                    <label class="form-label fw-bold small text-muted">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i
                                class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control bg-light border-start-0 ps-0"
                            placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 rounded-3 fw-bold"
                        style="background-color: var(--primary-color); border: none;">
                        Gửi mã xác thực
                    </button>
                </div>
            </form>

            <div class="text-center small">
                <a th:href="@{/login}" class="text-decoration-none fw-bold" style="color: var(--primary-color);">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
                </a>
            </div>
        </div>
    </div>
</body>

</html>
