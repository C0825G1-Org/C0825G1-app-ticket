<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #7c3aed;
            --secondary-color: #db2777;
            --dark-color: #0f172a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .btn-gradient {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            transition: transform 0.2s;
        }

        .btn-gradient:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.3);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(124, 58, 237, 0.15);
        }

        .social-btn {
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="login-card mx-auto p-5">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center gap-2 mb-3">
                    <div class="rounded-3 d-flex align-items-center justify-content-center text-white"
                        style="width: 48px; height: 48px; background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));">
                        <span class="fs-4 fw-bold">E</span>
                    </div>
                    <span class="fw-bold fs-3">EventPro</span>
                </div>
                <h4 class="fw-bold mb-2">Chào mừng trở lại!</h4>
                <p class="text-muted mb-0">Đăng nhập để tiếp tục</p>
            </div>

            <!-- Error/Success Messages -->
            <!-- Check param.error for Security redirect, or attribute error for manual errors -->
            <div th:if="${param.error}" class="alert alert-danger">
                Email hoặc mật khẩu không chính xác!
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                Đăng xuất thành công!
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" name="email" class="form-control form-control-lg border-start-0 ps-0"
                            placeholder="your@email.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" name="password" class="form-control form-control-lg border-start-0 ps-0"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
                        <label class="form-check-label text-muted small" for="remember">Ghi nhớ đăng nhập</label>
                    </div>
                    <a th:href="@{/forgot-password}" class="text-decoration-none small fw-bold"
                        style="color: var(--primary-color);">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-gradient btn-lg w-100 rounded-3 fw-bold mb-3">
                    Đăng nhập
                </button>
            </form>

            <!-- Divider -->
            <div class="position-relative my-4">
                <hr>
                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">
                    Hoặc tiếp tục với
                </span>
            </div>

            <!-- Social Login -->
            <div class="mb-4">
                <a href="/oauth2/authorization/google"
                    class="btn social-btn w-100 py-2 rounded-3 text-decoration-none text-dark">
                    <i class="bi bi-google text-danger me-2"></i>
                    Đăng nhập bằng Google
                </a>
            </div>

            <!-- Register Link -->
            <div class="text-center">
                <span class="text-muted">Chưa có tài khoản?</span>
                <a th:href="@{/register}" class="text-primary text-decoration-none fw-bold ms-1">Đăng ký ngay</a>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-4">
                <a th:href="@{/}" class="btn btn-link text-muted text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Về trang chủ
                </a>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
