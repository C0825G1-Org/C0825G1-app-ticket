<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực đặt lại mật khẩu - AppTicket</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7c3aed;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>

<body>
    <div class="card auth-card shadow-lg rounded-4 border-0 p-4">
        <div class="card-body text-center">
            <div class="mb-4">
                <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-shield-lock-fill fs-2"></i>
                </div>
                <h4 class="fw-bold">Nhập mã xác thực</h4>
                <p class="text-muted small">
                    Mã xác thực đã được gửi tới email <br>
                    <strong class="text-dark" th:text="${email}">user@example.com</strong>
                </p>
            </div>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            </div>

            <form th:action="@{/verify-forgot-password}" method="post">
                <div class="mb-4">
                    <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold"
                        placeholder="• • • • • •" maxlength="6" style="letter-spacing: 0.5em;" required
                        autocomplete="off">
                    <div class="form-text mt-2">Nhập mã 6 số chúng tôi vừa gửi cho bạn</div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 rounded-3 fw-bold"
                        style="background-color: var(--primary-color); border: none;">
                        Xác nhận
                    </button>
                </div>
            </form>

            <div class="text-center small">
                <span class="text-muted">Không nhận được mã?</span>
                <a th:href="@{/forgot-password}" class="text-decoration-none fw-bold ms-1"
                    style="color: var(--primary-color);">Gửi lại</a>
            </div>
        </div>
    </div>
</body>

</html>
