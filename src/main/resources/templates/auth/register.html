<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - AppTicket</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7c3aed;
            --secondary-color: #6d28d9;
            --accent-color: #8b5cf6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card shadow-lg rounded-4 border-0 p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="bi bi-ticket-perforated-fill fs-1 text-primary mb-2"></i>
                            <h4 class="fw-bold">Đăng ký tài khoản</h4>
                            <p class="text-muted small">Tạo tài khoản để đặt vé ngay</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/register}" th:object="${registerDTO}" method="post" novalidate>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Họ và tên</label>
                                <input type="text" class="form-control" th:field="*{fullName}"
                                    placeholder="Nhập họ tên đầy đủ">
                                <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"
                                    class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Email</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                    placeholder="name@example.com">
                                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                                    class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Số điện thoại</label>
                                <input type="tel" class="form-control" th:field="*{phoneNumber}"
                                    placeholder="09xxxxxxxxx">
                                <div th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"
                                    class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Mật khẩu</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                    placeholder="••••••••">
                                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                                    class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Nhập lại mật khẩu</label>
                                <input type="password" class="form-control" th:field="*{confirmPassword}"
                                    placeholder="••••••••">
                                <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
                                    class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" th:field="*{terms}">
                                <label class="form-check-label small text-muted" for="terms">
                                    Tôi đồng ý với <a href="#" class="text-decoration-none"
                                        style="color: var(--primary-color);">Điều khoản sử dụng</a> và <a href="#"
                                        class="text-decoration-none" style="color: var(--primary-color);">Chính sách bảo
                                        mật</a>
                                </label>
                                <div th:if="${#fields.hasErrors('terms')}" th:errors="*{terms}"
                                    class="text-danger small mt-1"></div>
                            </div>

                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-primary py-2 rounded-3 fw-bold"
                                    style="background-color: var(--primary-color); border: none;">
                                    Đăng ký
                                </button>
                            </div>

                            <div class="text-center small">
                                <span class="text-muted">Đã có tài khoản?</span>
                                <a th:href="@{/login}" class="text-decoration-none fw-bold ms-1"
                                    style="color: var(--primary-color);">Đăng nhập</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
