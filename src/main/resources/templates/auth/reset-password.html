<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - AppTicket</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7c3aed;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>

<body>
    <div class="card auth-card shadow-lg rounded-4 border-0 p-4">
        <div class="card-body text-center">
            <div class="mb-4">
                <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-arrow-repeat fs-2"></i>
                </div>
                <h4 class="fw-bold">Đặt lại mật khẩu</h4>
                <p class="text-muted small">
                    Vui lòng nhập mật khẩu mới cho tài khoản của bạn.
                </p>
            </div>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" method="post">
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold small text-muted">Mật khẩu mới</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i
                                class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-light border-start-0 ps-0"
                            placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label fw-bold small text-muted">Xác nhận mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i
                                class="bi bi-lock-fill"></i></span>
                        <input type="password" name="confirmPassword" class="form-control bg-light border-start-0 ps-0"
                            placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 rounded-3 fw-bold"
                        style="background-color: var(--primary-color); border: none;">
                        Xác nhận đổi mật khẩu
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
