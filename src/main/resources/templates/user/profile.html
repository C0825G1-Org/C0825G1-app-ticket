<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân - EventPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>

<body>
    <div th:replace="~{common/header :: public-navbar-dark}"></div>

    <!-- Profile Content -->
    <section class="mt-5 pt-5 py-5">
        <div class="container-xl">
            <div class="row">
                <div class="col-12">
                    <h1 class="display-6 fw-bold mb-4">Trang cá nhân</h1>

                    <div class="card">
                        <div class="card-body p-4">
                            <div class="row">
                                <div class="col-md-3 text-center mb-4">
                                    <i class="bi bi-person-circle"
                                        style="font-size: 120px; color: var(--primary-color);"></i>
                                </div>
                                <div class="col-md-9">
                                    <h3 class="fw-bold mb-3">Thông tin tài khoản</h3>
                                    <table class="table table-borderless">
                                        <tr>
                                            <th width="150">Email:</th>
                                            <td sec:authentication="name">user@example.com</td>
                                        </tr>
                                        <tr>
                                            <th>Vai trò:</th>
                                            <td sec:authentication="principal.authorities">USER</td>
                                        </tr>
                                    </table>

                                    <div class="mt-4">
                                        <a th:href="@{/tickets}" class="btn btn-primary me-2">
                                            <i class="bi bi-ticket-perforated me-2"></i>Xem vé của tôi
                                        </a>
                                        <form th:action="@{/logout}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-outline-danger">
                                                <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{common/footer :: footer-dark}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
