<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/layout :: head('Sự kiện của tôi')}">
</head>

<body>
    <div th:replace="~{common/layout :: user-layout(~{::content})}">
        <div th:fragment="content">
            <div class="container-xl mt-5 pt-5 mb-5">
                <!-- Header for Page -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold mb-0">Sự kiện của tôi</h4>
                        <p class="text-muted small mb-0">Quản lý các sự kiện mà bạn tổ chức</p>
                    </div>
                </div>

                <!-- Events Table -->
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                    <tr class="text-muted small text-uppercase">
                                        <th class="px-4 py-3 fw-bold">Sự kiện</th>
                                        <th class="px-4 py-3 fw-bold">Danh mục</th>
                                        <th class="px-4 py-3 fw-bold">Thời gian</th>
                                        <th class="px-4 py-3 fw-bold">Trạng thái</th>
                                        <th class="px-4 py-3 fw-bold text-end">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="event : ${events}" th:id="'event-row-' + ${event.id}">
                                        <td class="px-4 py-3">
                                            <div class="d-flex align-items-center gap-3">
                                                <div
                                                    th:with="banner=${event.eventMedias.^[mediaPurpose.name() == 'BANNER']}, logo=${event.eventMedias.^[mediaPurpose.name() == 'LOGO']}">
                                                    <img th:src="${banner != null ? banner.mediaUrl : (logo != null ? logo.mediaUrl : (event.eventMedias.isEmpty() ? 'https://via.placeholder.com/60' : event.eventMedias[0].mediaUrl))}"
                                                        class="rounded" width="60" height="60"
                                                        style="object-fit: cover; min-width: 60px;">
                                                </div>
                                                <div>
                                                    <div class="fw-bold" th:text="${event.title}">Title</div>

                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3"><span class="badge bg-primary-subtle text-primary"
                                                th:text="${event.category.name}">Cat</span></td>
                                        <td class="px-4 py-3 text-muted">
                                            <span
                                                th:if="${event.eventOccurrences != null && !event.eventOccurrences.isEmpty()}"
                                                th:text="${#temporals.format(event.eventOccurrences[0].startTime, 'dd/MM/yyyy')}">Date</span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <div class="d-flex align-items-center gap-2">
                                                <span class="badge rounded-pill px-3"
                                                    th:classappend="${event.status.name() == 'DRAFT' ? 'bg-secondary-subtle text-secondary' : (event.status.name() == 'PENDING' ? 'bg-warning-subtle text-warning' : (event.status.name() == 'APPROVED' ? 'bg-success-subtle text-success' : (event.status.name() == 'HAPPENING' ? 'bg-primary-subtle text-primary' : (event.status.name() == 'FINISHED' ? 'bg-info-subtle text-info' : (event.status.name() == 'DELETED' ? 'bg-dark-subtle text-dark text-decoration-line-through' : 'bg-danger-subtle text-danger')))))}"
                                                    th:text="${event.status.name() == 'DRAFT' ? 'Nháp' : (event.status.name() == 'PENDING' ? 'Chờ duyệt' : (event.status.name() == 'APPROVED' ? 'Đã duyệt' : (event.status.name() == 'HAPPENING' ? 'Đang diễn ra' : (event.status.name() == 'FINISHED' ? 'Đã kết thúc' : (event.status.name() == 'DELETED' ? 'Đã xóa' : (event.status.name() == 'CANCELLED' ? 'Đã hủy' : 'Từ chối'))))))}">Status</span>


                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-end">
                                            <div class="dropdown">
                                                <button class="btn btn-sm btn-outline-secondary rounded-3 dropdown-toggle"
                                                    type="button" data-bs-toggle="dropdown">
                                                    Hành động
                                                </button>
                                                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm">
                                                    <li>
                                                        <a class="dropdown-item"
                                                            th:href="@{/user/events/detail/{id}(id=${event.id})}">
                                                            <i class="bi bi-eye me-2"></i> Xem chi tiết
                                                        </a>
                                                    </li>
                                                    <!-- Edit moved to detail page per UX change -->
                                                    <li>
                                                        <button type="button" class="dropdown-item"
                                                            th:onclick="'duplicateEvent(' + ${event.id} + ')'">
                                                            <i class="bi bi-files me-2"></i> Nhân bản
                                                        </button>
                                                    </li>
                                                    <!-- Xóa được hiển thị trên trang chi tiết (detail). Bỏ mục Xóa khỏi danh sách theo yêu cầu. -->
                                                </ul>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${events.empty}">
                                        <td colspan="5" class="text-center py-4 text-muted">Bạn chưa có sự kiện nào.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${events.totalPages > 1}" class="d-flex justify-content-center mt-4">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${events.first ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/user/events(page=${events.number - 1}, size=${events.size})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}"
                                th:classappend="${events.number == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/user/events(page=${i}, size=${events.size})}"
                                    th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${events.last ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/user/events(page=${events.number + 1}, size=${events.size})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>

                <!-- Floating Action Button for Create -->
                <a th:href="@{/user/events/create}"
                    class="btn btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center"
                    title="Tạo sự kiện mới"
                    style="position: fixed; bottom: 40px; right: 40px; width: 60px; height: 60px; z-index: 1000; background-color: #6f42c1; border: none; transition: transform 0.2s;">
                    <i class="bi bi-plus-lg fs-2"></i>
                </a>

                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        // SweetAlert2 Toast Mixin
                        const Toast = Swal.mixin({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 3000,
                            timerProgressBar: true,
                            didOpen: (toast) => {
                                toast.onmouseenter = Swal.stopTimer;
                                toast.onmouseleave = Swal.resumeTimer;
                            }
                        });

                        window.deleteEvent = function (id, title) {
                            Swal.fire({
                                title: `Xóa sự kiện "${title}"?`,
                                text: "Hành động này không thể hoàn tác!",
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonColor: '#d33',
                                cancelButtonColor: '#3085d6',
                                confirmButtonText: 'Đồng ý xóa',
                                cancelButtonText: 'Hủy'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    // Get CSRF Token
                                    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                                    fetch('/user/events/delete/' + id, {
                                        method: 'DELETE',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            [csrfHeader]: csrfToken
                                        }
                                    })
                                        .then(async response => {
                                            if (response.ok) {
                                                Toast.fire({
                                                    icon: 'success',
                                                    title: 'Đã xóa sự kiện thành công!'
                                                });
                                                document.getElementById('event-row-' + id).remove();
                                            } else {
                                                const errorText = await response.text();
                                                Toast.fire({
                                                    icon: 'error',
                                                    title: 'Lỗi: ' + (errorText || 'Xóa sự kiện thất bại.')
                                                });
                                            }
                                        })
                                        .catch(error => {
                                            console.error('Error:', error);
                                            Toast.fire({
                                                icon: 'error',
                                                title: 'Đã xảy ra lỗi khi xóa sự kiện.'
                                            });
                                        });
                                }
                            });
                        }

                        window.duplicateEvent = function (id, title) {
                            Swal.fire({
                                title: `Nhân bản sự kiện "${title}"?`,
                                text: "Sẽ tạo ra một bản sao mới ở trạng thái NHÁP.",
                                icon: 'info',
                                showCancelButton: true,
                                confirmButtonColor: '#3085d6',
                                cancelButtonColor: '#d33',
                                confirmButtonText: 'Nhân bản ngay',
                                cancelButtonText: 'Hủy'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                                    // Show loading
                                    Swal.fire({
                                        title: 'Đang xử lý...',
                                        allowOutsideClick: false,
                                        didOpen: () => { Swal.showLoading(); }
                                    });

                                    fetch('/user/events/' + id + '/duplicate', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            [csrfHeader]: csrfToken
                                        }
                                    })
                                        .then(response => response.json())
                                        .then(data => {
                                            if (data.status === 'success') {
                                                Swal.fire({
                                                    icon: 'success',
                                                    title: 'Thành công!',
                                                    text: 'Đang chuyển hướng đến trang chỉnh sửa...',
                                                    timer: 1500,
                                                    showConfirmButton: false
                                                }).then(() => {
                                                    window.location.href = data.redirectUrl;
                                                });
                                            } else {
                                                Swal.fire('Lỗi', data.message || 'Có lỗi xảy ra', 'error');
                                            }
                                        })
                                        .catch(error => {
                                            console.error('Error:', error);
                                            Swal.fire('Lỗi', 'Không thể kết nối đến server', 'error');
                                        });
                                }
                            });
                        }


                    });
                </script>
            </div>
        </div>
    </div>
</body>

</html>
