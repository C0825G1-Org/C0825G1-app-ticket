<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/layout :: head('Sự kiện của tôi')}">
</head>

<body style="background-color: #0f172a;" data-bs-theme="dark">
    <div th:replace="~{common/layout :: user-layout(~{::content})}">
        <div th:fragment="content">
            <div class="container-xl mt-5 pt-5 mb-5">
                <!-- Header for Page -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold mb-0 text-white">Sự kiện của tôi</h4>
                        <p class="text-white-50 small mb-0">Quản lý các sự kiện mà bạn tổ chức</p>
                    </div>
                    <a th:href="@{/user/events/create}" class="btn btn-gradient rounded-pill px-4 shadow-sm"
                        style="background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); color: white; border: none;">
                        <i class="bi bi-plus-lg me-2"></i>Thêm sự kiện
                    </a>
                </div>

                <!-- Events Table -->
                <div class="card card-glass-dark border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table text-white align-middle mb-0"
                                style="border-color: rgba(255,255,255,0.1);">
                                <thead style="background-color: rgba(255,255,255,0.05);">
                                    <tr class="text-muted small text-uppercase">
                                        <th class="px-4 py-3 fw-bold">Sự kiện</th>
                                        <th class="px-4 py-3 fw-bold">Danh mục</th>
                                        <th class="px-4 py-3 fw-bold">Thời gian</th>
                                        <th class="px-4 py-3 fw-bold">Trạng thái</th>
                                        <th class="px-4 py-3 fw-bold text-end">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="event : ${events}" th:id="'event-row-' + ${event.id}">
                                        <td class="px-4 py-3">
                                            <div class="d-flex align-items-center gap-3">
                                                <div
                                                    th:with="banner=${event.eventMedias.^[mediaPurpose.name() == 'BANNER']}, logo=${event.eventMedias.^[mediaPurpose.name() == 'LOGO']}">
                                                    <img th:src="${banner != null ? banner.mediaUrl : (logo != null ? logo.mediaUrl : (event.eventMedias.isEmpty() ? 'https://via.placeholder.com/60' : event.eventMedias[0].mediaUrl))}"
                                                        class="rounded" width="60" height="60"
                                                        style="object-fit: cover; min-width: 60px;">
                                                </div>
                                                <div>
                                                    <div class="fw-bold text-white" th:text="${event.title}">Title</div>

                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3"><span
                                                class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25"
                                                th:text="${event.category.name}">Cat</span></td>
                                        <td class="px-4 py-3 text-white-50">
                                            <span
                                                th:if="${event.eventOccurrences != null && !event.eventOccurrences.isEmpty()}"
                                                th:text="${#temporals.format(event.eventOccurrences[0].startTime, 'dd/MM/yyyy')}">Date</span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <div class="d-flex align-items-center gap-2">
                                                <span
                                                    class="badge rounded-pill px-3 bg-opacity-25 border border-opacity-25"
                                                    th:classappend="${event.status.name() == 'DRAFT' ? 'bg-secondary text-secondary border-secondary' : (event.status.name() == 'PENDING' ? 'bg-warning text-warning border-warning' : (event.status.name() == 'APPROVED' ? 'bg-success text-success border-success' : (event.status.name() == 'HAPPENING' ? 'bg-primary text-primary border-primary' : (event.status.name() == 'FINISHED' ? 'bg-info text-info border-info' : (event.status.name() == 'DELETED' ? 'bg-dark text-white border-dark text-decoration-line-through' : 'bg-danger text-danger border-danger')))))}"
                                                    th:text="${event.status.name() == 'DRAFT' ? 'Nháp' : (event.status.name() == 'PENDING' ? 'Chờ duyệt' : (event.status.name() == 'APPROVED' ? 'Đã duyệt' : (event.status.name() == 'HAPPENING' ? 'Đang diễn ra' : (event.status.name() == 'FINISHED' ? 'Đã kết thúc' : (event.status.name() == 'DELETED' ? 'Đã xóa' : (event.status.name() == 'CANCELLED' ? 'Đã hủy' : 'Từ chối'))))))}">Status</span>


                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-end">
                                            <a th:href="@{/user/events/detail/{id}(id=${event.id})}"
                                                class="btn btn-sm btn-outline-light me-1 rounded-3"
                                                title="Xem chi tiết">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/user/events/edit/{id}(id=${event.id})}"
                                                class="btn btn-sm btn-outline-light me-1 rounded-3" title="Sửa">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <button type="button" class="btn btn-sm btn-outline-danger rounded-3"
                                                th:data-id="${event.id}" th:data-title="${event.title}"
                                                onclick="deleteEvent(this.getAttribute('data-id'), this.getAttribute('data-title'))"
                                                title="Xóa">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${events.empty}">
                                        <td colspan="5" class="text-center py-4 text-muted">Bạn chưa có sự kiện nào.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${events.totalPages > 1}" class="d-flex justify-content-center mt-4">
                    <nav aria-label="Page navigation">
                        <ul class="pagination pagination-custom">
                            <li class="page-item" th:classappend="${events.first ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/user/events(page=${events.number - 1}, size=${events.size})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}"
                                th:classappend="${events.number == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/user/events(page=${i}, size=${events.size})}"
                                    th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${events.last ? 'disabled' : ''}">
                                <a class="page-link"
                                    th:href="@{/user/events(page=${events.number + 1}, size=${events.size})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>



                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        // SweetAlert2 Toast Mixin
                        const Toast = Swal.mixin({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 3000,
                            timerProgressBar: true,
                            didOpen: (toast) => {
                                toast.onmouseenter = Swal.stopTimer;
                                toast.onmouseleave = Swal.resumeTimer;
                            }
                        });

                        window.deleteEvent = function (id, title) {
                            Swal.fire({
                                title: `Xóa sự kiện "${title}"?`,
                                text: "Hành động này không thể hoàn tác!",
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonColor: '#d33',
                                cancelButtonColor: '#3085d6',
                                confirmButtonText: 'Đồng ý xóa',
                                cancelButtonText: 'Hủy'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    // Get CSRF Token
                                    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                                    fetch('/user/events/delete/' + id, {
                                        method: 'DELETE',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            [csrfHeader]: csrfToken
                                        }
                                    })
                                        .then(async response => {
                                            if (response.ok) {
                                                Toast.fire({
                                                    icon: 'success',
                                                    title: 'Đã xóa sự kiện thành công!'
                                                });
                                                document.getElementById('event-row-' + id).remove();
                                            } else {
                                                const errorText = await response.text();
                                                Toast.fire({
                                                    icon: 'error',
                                                    title: 'Lỗi: ' + (errorText || 'Xóa sự kiện thất bại.')
                                                });
                                            }
                                        })
                                        .catch(error => {
                                            console.error('Error:', error);
                                            Toast.fire({
                                                icon: 'error',
                                                title: 'Đã xảy ra lỗi khi xóa sự kiện.'
                                            });
                                        });
                                }
                            });
                        }

                        window.duplicateEvent = function (id, title) {
                            Swal.fire({
                                title: `Nhân bản sự kiện "${title}"?`,
                                text: "Sẽ tạo ra một bản sao mới ở trạng thái NHÁP.",
                                icon: 'info',
                                showCancelButton: true,
                                confirmButtonColor: '#3085d6',
                                cancelButtonColor: '#d33',
                                confirmButtonText: 'Nhân bản ngay',
                                cancelButtonText: 'Hủy'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                                    // Show loading
                                    Swal.fire({
                                        title: 'Đang xử lý...',
                                        allowOutsideClick: false,
                                        didOpen: () => { Swal.showLoading(); }
                                    });

                                    fetch('/user/events/' + id + '/duplicate', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            [csrfHeader]: csrfToken
                                        }
                                    })
                                        .then(response => response.json())
                                        .then(data => {
                                            if (data.status === 'success') {
                                                Swal.fire({
                                                    icon: 'success',
                                                    title: 'Thành công!',
                                                    text: 'Đang chuyển hướng đến trang chỉnh sửa...',
                                                    timer: 1500,
                                                    showConfirmButton: false
                                                }).then(() => {
                                                    window.location.href = data.redirectUrl;
                                                });
                                            } else {
                                                Swal.fire('Lỗi', data.message || 'Có lỗi xảy ra', 'error');
                                            }
                                        })
                                        .catch(error => {
                                            console.error('Error:', error);
                                            Swal.fire('Lỗi', 'Không thể kết nối đến server', 'error');
                                        });
                                }
                            });
                        }


                    });
                </script>
            </div>
        </div>
    </div>
</body>

</html>
