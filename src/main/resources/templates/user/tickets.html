<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vé của tôi - EventPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>

<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{common/header :: public-navbar-dark}"></div>

    <!-- My Tickets Content -->
    <section class="mt-5 pt-5 py-5 flex-grow-1">
        <div class="container-xl">
            <div class="row">
                <div class="col-12">
                    <h1 class="display-6 fw-bold mb-4">
                        <i class="bi bi-ticket-perforated me-2"></i>Vé của tôi
                    </h1>

                    <!-- Empty State -->
                    <div class="card">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-ticket-perforated-fill text-muted mb-3" style="font-size: 80px;"></i>
                            <h4 class="fw-bold mb-2">Chưa có vé nào</h4>
                            <p class="text-muted mb-4">Bạn chưa đặt vé cho sự kiện nào. Hãy khám phá và đặt vé ngay!</p>
                            <a th:href="@{/events}" class="btn btn-primary btn-lg">
                                <i class="bi bi-search me-2"></i>Khám phá sự kiện
                            </a>
                        </div>
                    </div>

                    <!-- TODO: Add ticket list here when tickets exist -->
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{common/footer :: footer-dark}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
