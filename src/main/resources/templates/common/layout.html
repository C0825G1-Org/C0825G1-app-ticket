<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - EventPro'">EventPro</title>
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Common Styles -->
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>

<body>
    <!-- Public Layout: Navbar + Content + Footer -->
    <div th:fragment="public-layout(content)">
        <div th:replace="~{common/header :: public-navbar}"></div>
        <main>
            <th:block th:insert="${content}"></th:block>
        </main>
        <div th:replace="~{common/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>

    <!-- User Layout: User Navbar + Content + Footer -->
    <div th:fragment="user-layout(content)">
        <div th:replace="~{common/user-header :: user-navbar}"></div>
        <main>
            <th:block th:insert="${content}"></th:block>
        </main>
        <div th:replace="~{common/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>

    <!-- Admin Layout: Sidebar + Header + Content -->
    <div th:fragment="admin-layout(content)">
        <div th:replace="~{common/sidebar :: admin-sidebar}"></div>
        <main class="main-content">
            <div th:replace="~{common/sidebar :: admin-header}"></div>
            <div class="container-fluid p-4">
                <th:block th:insert="${content}"></th:block>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- SweetAlert2 JS -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </div>
</body>

</html>
