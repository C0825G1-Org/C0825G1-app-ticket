<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="admin-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - EventPro Admin'">EventPro Admin</title>
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Common Styles -->
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - EventPro'">EventPro</title>
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Common Styles -->
    <th:block th:replace="~{common/styles :: styles}"></th:block>
    <!-- Custom CSS (Dark Theme) -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>
    <!-- Public Layout: Navbar + Content + Footer -->
    <div th:fragment="public-layout(content)">
        <div th:replace="~{common/header :: public-navbar}"></div>
        <main>
            <th:block th:insert="${content}"></th:block>
        </main>
        <div th:replace="~{common/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>

    <div th:fragment="user-layout(content)" class="d-flex flex-column min-vh-100">
        <div th:replace="~{common/header :: public-navbar-dark}"></div>
        <main class="flex-grow-1">
            <th:block th:insert="${content}"></th:block>
        </main>
        <div th:replace="~{common/footer :: footer-dark}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- SweetAlert2 JS -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </div>

    <!-- Admin Layout: Sidebar + Header + Content -->
    <div th:fragment="admin-layout(content)">
        <div th:replace="~{common/sidebar :: admin-sidebar}"></div>
        <main class="main-content">
            <div th:replace="~{common/sidebar :: admin-header}"></div>
            <div class="container-fluid p-4">
                <th:block th:insert="${content}"></th:block>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- SweetAlert2 JS -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </div>

    <!-- Floating Action Button Fragment -->
    <a th:fragment="fab-button(url)" th:href="${url}"
        class="btn btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center"
        title="Thêm mới"
        style="position: fixed; bottom: 40px; right: 40px; width: 60px; height: 60px; z-index: 1000; background-color: #6f42c1; border: none; transition: transform 0.2s;">
        <i class="bi bi-plus-lg fs-2"></i>
    </a>

    <!-- Pagination Fragment -->
    <div th:fragment="pagination(page, baseUrl)" th:if="${page.totalPages > 1}"
        class="d-flex justify-content-center mt-4">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <!-- Previous Page -->
                <li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
                    <!-- Build URL with existing params + page -->
                    <a class="page-link"
                        th:href="@{${baseUrl}(page=${page.number - 1}, size=${page.size}, keyword=${keyword}, roleId=${roleId}, status=${status}, title=${title}, categoryId=${categoryId}, startDate=${startDate}, endDate=${endDate})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>

                <!-- Page Numbers -->
                <!-- Logic to show limited page numbers can be complex, for now showing all or simple sequence -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${page.number == i ? 'active' : ''}">
                    <a class="page-link"
                        th:href="@{${baseUrl}(page=${i}, size=${page.size}, keyword=${keyword}, roleId=${roleId}, status=${status}, title=${title}, categoryId=${categoryId}, startDate=${startDate}, endDate=${endDate})}"
                        th:text="${i + 1}">1</a>
                </li>

                <!-- Next Page -->
                <li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
                    <a class="page-link"
                        th:href="@{${baseUrl}(page=${page.number + 1}, size=${page.size}, keyword=${keyword}, roleId=${roleId}, status=${status}, title=${title}, categoryId=${categoryId}, startDate=${startDate}, endDate=${endDate})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>

</html>
