<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Người dùng - Admin - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{common/sidebar :: admin-sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <div th:replace="~{common/sidebar :: admin-header}"></div>

        <!-- Content -->
        <div class="container-fluid p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Chỉnh sửa Người dùng</h2>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary rounded-3">
                    <i class="bi bi-arrow-left me-2"></i>Quay lại
                </a>
            </div>

            <!-- Error Messages -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- User Info Header -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center gap-4">
                        <img th:src="'https://ui-avatars.com/api/?name=' + ${userDetail.fullName} + '&size=80&background=7c3aed&color=fff'"
                            class="rounded-circle" width="80" height="80">
                        <div>
                            <h4 class="fw-bold mb-1" th:text="${userDetail.fullName}">Nguyễn Văn A</h4>
                            <p class="text-muted mb-0" th:text="${userDetail.email}">email@example.com</p>
                            <div class="mt-2">
                                <span th:if="${userDetail.enabled}" class="badge bg-success-subtle text-success">Hoạt
                                    động</span>
                                <span th:unless="${userDetail.enabled}" class="badge bg-danger-subtle text-danger">Bị
                                    khóa</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Edit Form -->
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom py-3 px-4">
                    <h5 class="fw-bold mb-0">Thông tin tài khoản</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${user}" method="post"
                        novalidate>
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{fullName}"
                                    class="form-control form-control-lg rounded-3">
                                <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small"
                                    th:errors="*{fullName}"></div>
                            </div>
                            <!-- Email input removed from display, kept hidden for binding/validation -->
                            <input type="hidden" th:field="*{email}">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="tel" th:field="*{phoneNumber}"
                                    class="form-control form-control-lg rounded-3">
                                <div th:if="${#fields.hasErrors('phoneNumber')}" class="text-danger small"
                                    th:errors="*{phoneNumber}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Vai trò</label>
                                <select name="roleId" class="form-select form-select-lg rounded-3">
                                    <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"
                                        th:selected="${user.roleId == role.id}">USER</option>
                                </select>
                            </div>
                            <!-- Password field removed per requirements -->
                        </div>
                        <div class="mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-primary btn-lg px-5 rounded-3"
                                style="background-color: var(--primary-color); border: none;">
                                <i class="bi bi-check-circle me-2"></i>Lưu thay đổi
                            </button>
                            <a th:href="@{/admin/users}"
                                class="btn btn-outline-secondary btn-lg px-4 rounded-3 ms-2">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>



        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Script removed as email editing is disabled
    </script>
</body>

</html>
