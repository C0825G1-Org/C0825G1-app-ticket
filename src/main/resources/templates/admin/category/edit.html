<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Danh mục - Admin - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>
<style>
    body {
        font-family: 'Outfit', sans-serif;
    }
</style>

<body>

    <!-- Sidebar -->
    <div th:replace="~{common/sidebar :: admin-sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Custom Header for Category Page -->
        <header class="bg-white border-bottom sticky-top">
            <div class="container-fluid py-3 px-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-link d-lg-none text-dark p-0" type="button"
                            onclick="document.querySelector('.sidebar').classList.toggle('show')">
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h4 class="mb-0 fw-bold">Chỉnh sửa Danh mục</h4>
                            <p class="mb-0 text-muted small">Cập nhật thông tin danh mục sự kiện</p>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary rounded-3">
                            <i class="bi bi-arrow-left me-2"></i> Quay lại
                        </a>
                        <div class="vr mx-2"></div>
                        <button class="btn btn-link text-muted position-relative p-2">
                            <i class="bi bi-bell fs-5"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                                style="font-size: 0.6rem;">
                                3
                            </span>
                        </button>
                        <div class="d-flex align-items-center gap-2">
                            <img class="rounded-circle" width="40" height="40" th:src="${session.user != null}
          ? 'https://ui-avatars.com/api/?name=' + session.user.fullName + '&background=0f172a&color=fff'
          : 'https://ui-avatars.com/api/?name=Admin&background=0f172a&color=fff'">
                            <div class="d-none d-md-block">
                                <div class="fw-bold small"
                                    th:text="${session.user != null} ? ${session.user.fullName} : 'Admin'">Admin</div>
                                <div class="text-muted" style="font-size: 0.75rem;">Quản trị viên</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <div class="container-fluid p-4">
            <div class="row justify-content-center">
                <div class="col-lg-6">

                    <!-- Success/Error Messages -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{'/admin/categories/' + ${category.id} + '/edit'}" th:object="${category}"
                        method="post">
                        <div class="card border-0 shadow-sm rounded-4 mb-4">
                            <div class="card-header bg-white border-bottom py-3">
                                <h5 class="fw-bold mb-0">
                                    <i class="bi bi-pencil-square text-primary me-2"></i>
                                    Thông tin danh mục
                                </h5>
                            </div>
                            <div class="card-body p-4">
                                <!-- ID Field (Hidden or Display Only) -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-muted">
                                        <i class="bi bi-hash"></i> ID
                                    </label>
                                    <input type="text" class="form-control form-control-lg bg-light"
                                        th:value="${category.id}" disabled>
                                    <input type="hidden" th:field="*{id}">
                                </div>

                                <!-- Name Field -->
                                <div class="mb-3">
                                    <label for="name" class="form-label fw-bold">
                                        <i class="bi bi-tag-fill"></i> Tên danh mục
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control form-control-lg"
                                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" id="name"
                                        th:field="*{name}" placeholder="VD: Giáo dục">

                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                                        <span th:each="err : ${#fields.errors('name')}" th:text="${err}"></span>
                                    </div>
                                </div>

                                <!-- Description Field -->
                                <div class="mb-3">
                                    <label for="description" class="form-label fw-bold">
                                        <i class="bi bi-file-text"></i> Mô tả
                                    </label>
                                    <textarea class="form-control"
                                        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                        id="description" th:field="*{description}" rows="4"
                                        placeholder="Mô tả ngắn về danh mục này..."></textarea>

                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}">
                                        <span th:each="err : ${#fields.errors('description')}" th:text="${err}"></span>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex gap-3 justify-content-center mb-5">
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-lg rounded-3 px-5">
                                <i class="bi bi-x-lg me-2"></i>Hủy
                            </a>
                            <button type="submit" class="btn btn-gradient btn-lg rounded-3 px-5 fw-bold">
                                <i class="bi bi-check-lg me-2"></i>
                                Cập nhật Danh mục
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
