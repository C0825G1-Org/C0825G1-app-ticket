<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/layout :: head('Dashboard')}">
</head>

<body>
    <div th:replace="~{common/layout :: admin-layout(~{::content})}">
        <div th:fragment="content">

            <!-- Title -->
            <h2 class="fw-bold mb-4">Tổng quan</h2>

            <!-- Stats Cards -->
            <div class="row g-4 mb-5">
                <div class="col-md-6 col-lg-4">
                    <div class="card stats-card shadow-sm border-0 h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="text-muted fw-medium">Tổng doanh thu</span>
                                <div class="bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center"
                                    style="width: 48px; height: 48px; font-size: 1.5rem;">
                                    <i class="bi bi-currency-dollar"></i>
                                </div>
                            </div>
                            <h3 class="fw-bold mb-2"
                                th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ
                            </h3>
                            <div class="d-flex align-items-center text-success small">
                                <i class="bi bi-arrow-up me-1"></i>
                                <span>Tích lũy toàn thời gian</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="card stats-card shadow-sm border-0 h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="text-muted fw-medium">Vé đã bán</span>
                                <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center"
                                    style="width: 48px; height: 48px; font-size: 1.5rem;">
                                    <i class="bi bi-ticket-perforated"></i>
                                </div>
                            </div>
                            <h3 class="fw-bold mb-2" th:text="${#numbers.formatInteger(totalTicketsSold, 1, 'COMMA')}">0
                            </h3>
                            <div class="d-flex align-items-center text-success small">
                                <i class="bi bi-check-circle me-1"></i>
                                <span>Đã thanh toán thành công</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="card stats-card shadow-sm border-0 h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="text-muted fw-medium">Yêu cầu duyệt</span>
                                <div class="bg-warning-subtle text-warning rounded-circle d-flex align-items-center justify-content-center"
                                    style="width: 48px; height: 48px; font-size: 1.5rem;">
                                    <i class="bi bi-calendar-check"></i>
                                </div>
                            </div>
                            <h3 class="fw-bold mb-2" th:text="${pendingEventsCount}">0</h3>
                            <div class="text-muted small">
                                Cần xử lý: <span class="text-warning fw-bold" th:text="${pendingEventsCount}">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white border-bottom py-3 px-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0">Yêu cầu duyệt Sự kiện mới nhất</h5>
                        <a th:href="@{/admin/events(status='PENDING')}"
                            class="btn btn-link text-primary text-decoration-none fw-medium p-0">
                            Xem tất cả <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="bg-light">
                                <tr class="text-muted small text-uppercase">
                                    <th class="px-4 py-3 fw-bold">Sự kiện</th>
                                    <th class="px-4 py-3 fw-bold">Người tạo</th>
                                    <th class="px-4 py-3 fw-bold">Ngày tạo</th>
                                    <th class="px-4 py-3 fw-bold">Trạng thái</th>
                                    <th class="px-4 py-3 fw-bold text-end">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${pendingEvents.empty}">
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        Không có yêu cầu duyệt nào.
                                    </td>
                                </tr>
                                <tr th:each="event : ${pendingEvents}">
                                    <td class="px-4 py-3 fw-medium" th:text="${event.title}">Tên sự kiện</td>
                                    <td class="px-4 py-3 text-muted">
                                        <span
                                            th:text="${event.createdBy != null ? event.createdBy.fullName : 'Unknown'}">Người
                                            tạo</span>
                                    </td>
                                    <td class="px-4 py-3 text-muted"
                                        th:text="${#temporals.format(event.createdDate, 'dd/MM/yyyy HH:mm')}">Ngày tạo
                                    </td>
                                    <td class="px-4 py-3">
                                        <span class="badge bg-warning-subtle text-warning rounded-pill px-3 py-2">Chờ
                                            duyệt</span>
                                    </td>
                                    <td class="px-4 py-3 text-end">
                                        <a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
                                            class="btn btn-sm btn-outline-primary rounded-3 fw-medium">
                                            Xem chi tiết
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
