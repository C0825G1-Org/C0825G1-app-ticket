<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thông Báo Hủy Sự Kiện</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .header {
            background-color: #6c757d;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            padding: 20px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        .reason-box {
            background-color: #e2e3e5;
            color: #383d41;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            border: 1px solid #d6d8db;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Sự Kiện Đã Bị Hủy</h2>
        </div>
        <div class="content">
            <p>Xin chào <strong th:text="${organizerName}">Organizer</strong>,</p>
            <p>Sự kiện của bạn đã bị hủy trên hệ thống.</p>

            <h3>Thông tin sự kiện:</h3>
            <ul>
                <li><strong>Tên sự kiện:</strong> <span th:text="${eventTitle}">Tên Sự Kiện</span></li>
                <li><strong>Thời gian hủy:</strong> <span th:text="${actionDate}">01/01/2026</span></li>
            </ul>

            <h3>Lý do hủy:</h3>
            <div class="reason-box">
                <p th:text="${reason}">Lý do hủy...</p>
            </div>

            <p>Nếu bạn có thắc mắc, vui lòng liên hệ với bộ phận hỗ trợ.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 AppTicket System. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
