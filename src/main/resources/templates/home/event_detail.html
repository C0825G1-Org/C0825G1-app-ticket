<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' - EventPro'">Event Detail - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <th:block th:replace="~{common/styles :: styles}"></th:block>

    <style>
        /* Minimal custom CSS - Only what Bootstrap can't do */
        body {
            font-family: 'Outfit', sans-serif;
        }

        .hero-bg {
            min-height: 500px;
            background-size: cover;
            background-position: center;
        }

        .hero-overlay {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.8));
        }

        .qty-btn {
            width: 36px;
            height: 36px;
            transition: all 0.2s;
        }

        .qty-btn:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .ticket-card {
            position: sticky;
            top: 100px;
        }
    </style>
</head>

<body>
    <div th:replace="~{common/header :: public-navbar}"></div>

    <!-- Hero Section -->
    <section class="hero-bg position-relative d-flex align-items-end"
        th:style="'background-image: url(' + (${event.mediaUrl} ?: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30') + ');'">
        <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>
        <div class="container-xl position-relative text-white pb-4">
            <!-- Back Button & Actions -->
            <div class="d-flex justify-content-between align-items-start mb-4">
                <a th:href="@{/events}" class="btn btn-outline-light rounded-pill px-4 bg-opacity-25 bg-white">
                    <i class="bi bi-arrow-left me-2"></i>Quay lại
                </a>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light rounded-circle p-2 bg-opacity-25 bg-white"
                        style="width: 40px; height: 40px;" title="Yêu thích">
                        <i class="bi bi-heart"></i>
                    </button>
                    <button class="btn btn-outline-light rounded-circle p-2 bg-opacity-25 bg-white"
                        style="width: 40px; height: 40px;" title="Chia sẻ">
                        <i class="bi bi-share"></i>
                    </button>
                </div>
            </div>

            <!-- Event Info -->
            <div>
                <span class="badge bg-primary rounded-pill px-3 py-2 mb-3" th:text="${event.categoryName}">Music
                    Concert</span>
                <h1 class="display-4 fw-bold mb-3" th:text="${event.title}">EDM Symphony Night</h1>
                <h2 class="display-6 fw-light mb-4"
                    th:text="${event.startTime != null ? #temporals.year(event.startTime) : '2026'}">2026</h2>

                <div class="d-flex flex-wrap gap-3">
                    <div class="badge bg-white bg-opacity-25 text-white rounded-pill px-3 py-2">
                        <i class="bi bi-calendar3 me-2"></i>
                        <span
                            th:text="${event.startTime != null ? #temporals.format(event.startTime, 'dd/MM/yyyy • HH:mm') : 'TBA'}">
                            24/10/2026 • 20:00
                        </span>
                    </div>
                    <div class="badge bg-white bg-opacity-25 text-white rounded-pill px-3 py-2">
                        <i class="bi bi-geo-alt me-2"></i>
                        <span th:text="${event.location ?: 'Chưa cập nhật'}">SVĐ
                            QK7, TP. HCM</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <section class="py-5">
        <div class="container-xl">
            <div class="row">
                <!-- Left Column: Event Description -->
                <div class="col-lg-8 mb-4">
                    <div class="mb-5">
                        <h3 class="fw-bold mb-4">Giới thiệu sự kiện</h3>
                        <div class="text-muted lh-lg" th:utext="${event.description}">
                            Chào mừng đến với EDM Symphony Night 2026 - Sự kiện âm nhạc hoành tráng nhất năm...
                        </div>
                    </div>
                </div>

                <!-- Right Column: Ticket Selection -->
                <div class="col-lg-4">
                    <div class="ticket-card card shadow-lg rounded-4 border-0">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h5 class="fw-bold mb-0">Chọn vé</h5>
                                <span class="badge bg-success rounded-pill px-3">Còn vé</span>
                            </div>

                            <form id="ticketForm">
                                <div th:each="ticket : ${ticketTypes}"
                                    class="border border-2 border-light rounded-3 p-3 mb-3">
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <div class="flex-grow-1">
                                            <h6 class="fw-bold mb-1" th:text="${ticket.name}">Vé Phổ thông (GA)</h6>
                                            <small class="text-muted">
                                                Còn <span th:text="${ticket.availableQuantity}">100</span> vé
                                            </small>
                                        </div>
                                        <div class="text-end">
                                            <div class="fw-bold text-danger fs-5"
                                                th:text="${#numbers.formatInteger(ticket.price, 0, 'COMMA')} + 'đ'">
                                                500.000đ
                                            </div>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center">
                                        <small class="text-muted fw-semibold">Số lượng:</small>
                                        <div class="d-flex align-items-center gap-3">
                                            <button type="button"
                                                class="qty-btn btn btn-sm btn-outline-secondary rounded-circle p-0 minus-btn"
                                                th:data-ticket-id="${ticket.id}" th:data-price="${ticket.price}">
                                                <i class="bi bi-dash"></i>
                                            </button>
                                            <span class="fw-bold fs-5 qty-display"
                                                th:id="'qty-' + ${ticket.id}">0</span>
                                            <button type="button"
                                                class="qty-btn btn btn-sm btn-outline-secondary rounded-circle p-0 plus-btn"
                                                th:data-ticket-id="${ticket.id}" th:data-price="${ticket.price}"
                                                th:data-max="${ticket.availableQuantity}">
                                                <i class="bi bi-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <hr class="my-4">

                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <span class="fw-bold fs-5">Tổng cộng:</span>
                                    <span class="fs-3 fw-bold text-primary" id="totalPrice">0đ</span>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold"
                                    id="bookBtn" disabled>
                                    <i class="bi bi-ticket-perforated me-2"></i>Đặt vé ngay
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{common/footer :: footer}"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Ticket Selection JS -->
    <script>
        const ticketQuantities = {};

        // Plus button
        document.querySelectorAll('.plus-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const ticketId = this.dataset.ticketId;
                const price = parseFloat(this.dataset.price);
                const max = parseInt(this.dataset.max);

                if (!ticketQuantities[ticketId]) {
                    ticketQuantities[ticketId] = 0;
                }

                if (ticketQuantities[ticketId] < max) {
                    ticketQuantities[ticketId]++;
                    updateDisplay(ticketId);
                    updateTotal();
                }
            });
        });

        // Minus button
        document.querySelectorAll('.minus-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const ticketId = this.dataset.ticketId;
                const price = parseFloat(this.dataset.price);

                if (ticketQuantities[ticketId] && ticketQuantities[ticketId] > 0) {
                    ticketQuantities[ticketId]--;
                    updateDisplay(ticketId);
                    updateTotal();
                }
            });
        });

        function updateDisplay(ticketId) {
            document.getElementById('qty-' + ticketId).textContent = ticketQuantities[ticketId] || 0;
        }

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('.plus-btn').forEach(btn => {
                const ticketId = btn.dataset.ticketId;
                const price = parseFloat(btn.dataset.price);
                const qty = ticketQuantities[ticketId] || 0;
                total += price * qty;
            });

            document.getElementById('totalPrice').textContent =
                total > 0 ? total.toLocaleString('vi-VN') + 'đ' : '0đ';

            document.getElementById('bookBtn').disabled = total === 0;
        }

        // Form submit
        document.getElementById('ticketForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get event ID from URL
            const pathParts = window.location.pathname.split('/');
            const eventId = pathParts[pathParts.length - 1];

            // Build URL with ticket quantities
            const params = new URLSearchParams();
            let hasTickets = false;

            for (const [ticketId, quantity] of Object.entries(ticketQuantities)) {
                if (quantity > 0) {
                    params.append('ticket_' + ticketId, quantity);
                    hasTickets = true;
                }
            }

            if (hasTickets) {
                window.location.href = '/bookings/book/' + eventId + '?' + params.toString();
            }
        });
    </script>
</body>

</html>
