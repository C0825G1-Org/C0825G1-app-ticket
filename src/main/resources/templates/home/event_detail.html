<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' - EventPro'">Event Detail - EventPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .hero-section-detail {
            position: relative;
            min-height: 500px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding-bottom: 40px;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.8));
        }

        .hero-content {
            position: relative;
            z-index: 2;
            color: white;
        }

        .event-badge {
            display: inline-block;
            padding: 6px 16px;
            background: #3b82f6;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .ticket-card {
            position: sticky;
            top: 100px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        .ticket-type-item {
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .ticket-type-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #e5e7eb;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qty-btn:hover:not(:disabled) {
            border-color: #3b82f6;
            background: #3b82f6;
            color: white;
        }

        .qty-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .book-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .book-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .book-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .event-info-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            margin-right: 16px;
            margin-bottom: 16px;
        }

        .available-badge {
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div th:replace="~{common/header :: public-navbar}"></div>

    <!-- Hero Section -->
    <section class="hero-section-detail"
        th:style="'background-image: url(' + (${event.mediaUrl} ?: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30') + ');'">
        <div class="hero-overlay"></div>
        <div class="container-xl hero-content">
            <!-- Back Button & Actions -->
            <div class="d-flex justify-content-between align-items-start mb-4">
                <a th:href="@{/events}" class="back-btn">
                    <i class="bi bi-arrow-left me-2"></i>Quay lại
                </a>
                <div class="action-btns">
                    <button class="action-btn" title="Yêu thích">
                        <i class="bi bi-heart"></i>
                    </button>
                    <button class="action-btn" title="Chia sẻ">
                        <i class="bi bi-share"></i>
                    </button>
                </div>
            </div>

            <!-- Event Info -->
            <div>
                <span class="event-badge" th:text="${event.categoryName}">Music Concert</span>
                <h1 class="display-4 fw-bold mb-3" th:text="${event.title}">EDM Symphony Night</h1>
                <h2 class="display-6 fw-light mb-4" th:text="${#temporals.year(event.startTime)}">2026</h2>

                <div class="d-flex flex-wrap">
                    <div class="event-info-badge">
                        <i class="bi bi-calendar3"></i>
                        <span
                            th:text="${event.startTime != null ? #temporals.format(event.startTime, 'dd/MM/yyyy • HH:mm') : 'TBA'}">
                            24/10/2026 • 20:00
                        </span>
                    </div>
                    <div class="event-info-badge">
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${event.location}">SVĐ QK7, TP. HCM</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <section class="py-5">
        <div class="container-xl">
            <div class="row">
                <!-- Left Column: Event Description -->
                <div class="col-lg-8 mb-4">
                    <div class="mb-5">
                        <h3 class="fw-bold mb-3">Giới thiệu sự kiện</h3>
                        <div class="text-muted lh-lg" th:utext="${event.description}">
                            Chào mừng đến với EDM Symphony Night 2026 - Sự kiện âm nhạc hoành tráng nhất năm...
                        </div>
                    </div>

                    <!-- TODO: Add artists section if needed -->
                </div>

                <!-- Right Column: Ticket Selection -->
                <div class="col-lg-4">
                    <div class="ticket-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">Chọn vé</h5>
                            <span class="available-badge">Còn vé</span>
                        </div>

                        <form id="ticketForm">
                            <div th:each="ticket : ${ticketTypes}" class="ticket-type-item">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div class="flex-grow-1">
                                        <h6 class="fw-bold mb-0" th:text="${ticket.name}">Vé Phổ thông (GA)</h6>
                                    </div>
                                    <div class="text-end">
                                        <div class="fw-bold"
                                            th:text="${#numbers.formatInteger(ticket.price, 0, 'COMMA')} + 'đ'">
                                            500.000đ
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <small class="text-muted">Số lượng:</small>
                                    <div class="quantity-control">
                                        <button type="button" class="qty-btn minus-btn" th:data-ticket-id="${ticket.id}"
                                            th:data-price="${ticket.price}">
                                            <i class="bi bi-dash"></i>
                                        </button>
                                        <span class="fw-bold qty-display" th:id="'qty-' + ${ticket.id}">0</span>
                                        <button type="button" class="qty-btn plus-btn" th:data-ticket-id="${ticket.id}"
                                            th:data-price="${ticket.price}" th:data-max="${ticket.availableQuantity}">
                                            <i class="bi bi-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-3">

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="fw-bold">Tổng cộng:</span>
                                <span class="fs-4 fw-bold text-primary" id="totalPrice">0đ</span>
                            </div>

                            <button type="submit" class="book-btn" id="bookBtn" disabled>
                                Đặt vé ngay
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
