<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám phá Sự kiện - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{common/header :: public-navbar}"></div>

    <!-- Breadcrumb & Page Title -->
    <section class="mt-5 pt-5 py-4 bg-light border-bottom">
        <div class="container-xl">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Sự kiện</li>
                </ol>
            </nav>
            <h1 class="display-6 fw-bold mb-0">Khám phá Sự kiện</h1>
        </div>
    </section>

    <!-- Main Content -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <!-- Left Sidebar - Filters -->
                <div class="col-lg-3 mb-4">
                    <div class="sticky-top" style="top: 100px;">
                        <!-- Filter Form -->
                        <form method="get" th:action="@{/event/search}" id="filterForm">
                            <!-- Search Box -->
                            <div class="mb-4">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="bi bi-search text-muted"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0 ps-0"
                                        placeholder="Tìm kiếm..." name="search"
                                        th:value="${param.search != null ? param.search[0] : ''}">
                                </div>
                                <button type="submit" class="btn btn-primary btn-sm w-100 mt-2">
                                    <i class="bi bi-search me-1"></i> Tìm kiếm
                                </button>
                            </div>

                            <!-- Category Filter -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">Danh mục</h6>
                                <div class="d-flex flex-column gap-2">
                                    <div class="form-check">
                                        <input class="form-check-input category-filter" type="radio" name="category"
                                            value="" id="categoryAll" th:checked="${param.category == null}"
                                            onchange="this.form.submit()">
                                        <label class="form-check-label" for="categoryAll">
                                            Tất cả
                                        </label>
                                    </div>
                                    <div class="form-check" th:each="cat : ${categories}">
                                        <input class="form-check-input category-filter" type="radio" name="category"
                                            th:value="${cat.id}" th:id="'category' + ${cat.id}"
                                            th:checked="${param.category != null and param.category[0] == cat.id.toString()}"
                                            onchange="this.form.submit()">
                                        <label class="form-check-label" th:for="'category' + ${cat.id}">
                                            <span th:text="${cat.name}">Âm nhạc</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Location Filter -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">Địa điểm</h6>
                                <select class="form-select" name="location" onchange="this.form.submit()">
                                    <option value="" th:selected="${param.location == null}">Toàn quốc</option>
                                    <option value="Hà Nội"
                                        th:selected="${param.location != null and param.location[0] == 'Hà Nội'}">Hà Nội
                                    </option>
                                    <option value="TP. HCM"
                                        th:selected="${param.location != null and param.location[0] == 'TP. HCM'}">TP.
                                        Hồ
                                        Chí Minh</option>
                                    <option value="Đà Nẵng"
                                        th:selected="${param.location != null and param.location[0] == 'Đà Nẵng'}">Đà
                                        Nẵng
                                    </option>
                                    <option value="Hải Phòng"
                                        th:selected="${param.location != null and param.location[0] == 'Hải Phòng'}">Hải
                                        Phòng</option>
                                    <option value="Cần Thơ"
                                        th:selected="${param.location != null and param.location[0] == 'Cần Thơ'}">Cần
                                        Thơ
                                    </option>
                                    <option value="Nha Trang"
                                        th:selected="${param.location != null and param.location[0] == 'Nha Trang'}">Nha
                                        Trang</option>
                                </select>
                            </div>

                            <!-- Hidden field to preserve page on filter change -->
                            <input type="hidden" name="page" value="0">

                            <!-- NO TIME FILTER per requirement -->
                        </form>
                    </div>
                </div>

                <!-- Right Content - Events List -->
                <div class="col-lg-9">
                    <!-- Results Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <p class="text-muted mb-0">
                                Tìm thấy <strong th:text="${events != null ? events.totalElements : 0}">24</strong> sự
                                kiện
                            </p>
                        </div>
                        <div>
                            <form method="get" th:action="@{/event/search}" class="d-inline">
                                <!-- Preserve other filter params -->
                                <input type="hidden" name="search" th:value="${param.search}">
                                <input type="hidden" name="category" th:value="${param.category}">
                                <input type="hidden" name="location" th:value="${param.location}">

                                <label for="sortBy" class="small text-muted me-2">Sắp xếp:</label>
                                <select class="form-select form-select-sm d-inline-block w-auto" name="sort" id="sortBy"
                                    onchange="this.form.submit()">
                                    <option value="newest"
                                        th:selected="${param.sort == null or param.sort[0] == 'newest'}">Mới nhất
                                    </option>
                                    <option value="price-asc"
                                        th:selected="${param.sort != null and param.sort[0] == 'price-asc'}">Giá tăng
                                        dần</option>
                                    <option value="price-desc"
                                        th:selected="${param.sort != null and param.sort[0] == 'price-desc'}">Giá giảm
                                        dần</option>
                                    <option value="popular"
                                        th:selected="${param.sort != null and param.sort[0] == 'popular'}">Phổ biến nhất
                                    </option>
                                </select>
                            </form>
                        </div>
                    </div>

                    <!-- Events Grid -->
                    <div th:if="${events != null and !events.isEmpty()}" class="row g-4 mb-4">
                        <div th:each="event : ${events}" class="col-md-6 col-lg-4">
                            <div class="card card-event h-100 border-0 shadow-sm" style="cursor: pointer;"
                                th:onclick="'window.location.href=\'/event/' + ${event.id} + '\''">

                                <!-- Event Image -->
                                <div class="position-relative overflow-hidden">
                                    <img th:src="${event.mediaUrl != null and !event.mediaUrl.isEmpty()} ? ${event.mediaUrl} : 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800'"
                                        class="card-img-top" th:alt="${event.title}"
                                        style="height: 180px; object-fit: cover;">

                                    <!-- Category Badge -->
                                    <span th:if="${event.categoryName != null}"
                                        class="position-absolute top-0 start-0 m-3 badge"
                                        th:classappend="${event.categoryName == 'Music'} ? 'bg-primary' : 
                                                          (${event.categoryName == 'Business'} ? 'bg-info' : 
                                                          (${event.categoryName == 'Art'} ? 'bg-danger' : 'bg-secondary'))" th:text="${event.categoryName}">
                                        Music
                                    </span>
                                </div>

                                <!-- Event Info -->
                                <div class="card-body p-3">
                                    <!-- Date -->
                                    <div class="small text-primary fw-bold mb-2">
                                        <i class="bi bi-calendar3 me-1"></i>
                                        <span
                                            th:text="${event.startTime != null ? #temporals.format(event.startTime, 'dd ''THÁNG'' MM') : 'TBA'}">
                                            24 THÁNG 10
                                        </span>
                                    </div>

                                    <!-- Title -->
                                    <h6 class="card-title fw-bold mb-2"
                                        style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 48px;"
                                        th:text="${event.title}">
                                        EDM Symphony Night 2026
                                    </h6>

                                    <!-- Description -->
                                    <p class="card-text small text-muted mb-2"
                                        style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                                        th:text="${event.description}">
                                        Đêm nhạc gieo hưởng kết hợp điện tử.
                                    </p>

                                    <!-- Location -->
                                    <div class="small text-muted mb-3">
                                        <i class="bi bi-geo-alt-fill me-1"></i>
                                        <span th:text="${event.location ?: 'TBA'}">TP. HCM</span>
                                    </div>

                                    <!-- Price -->
                                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                        <small class="text-muted">Vé từ</small>
                                        <span class="fw-bold text-danger"
                                            th:if="${event.price != null and event.price > 0}"
                                            th:text="${#numbers.formatInteger(event.price, 0, 'COMMA')} + 'đ'">
                                            500.000đ
                                        </span>
                                        <span class="fw-bold text-success"
                                            th:unless="${event.price != null and event.price > 0}">
                                            Miễn phí
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div th:if="${events == null or events.isEmpty()}" class="text-center py-5">
                        <i class="bi bi-inbox text-muted" style="font-size: 4rem;"></i>
                        <h5 class="text-muted mt-3">Không tìm thấy sự kiện nào</h5>
                        <p class="text-muted">Hãy thử điều chỉnh bộ lọc của bạn</p>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${events != null and events.totalPages > 1}" aria-label="Page navigation" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <!-- Previous -->
                            <li class="page-item" th:classappend="${events.first} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/events(page=${events.number - 1}, size=${events.size})}"
                                    aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>

                            <!-- Page Numbers -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}"
                                th:classappend="${i == events.number} ? 'active'">
                                <a class="page-link" th:href="@{/events(page=${i}, size=${events.size})}"
                                    th:text="${i + 1}">1</a>
                            </li>

                            <!-- Next -->
                            <li class="page-item" th:classappend="${events.last} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/events(page=${events.number + 1}, size=${events.size})}"
                                    aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{common/footer :: footer}"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
