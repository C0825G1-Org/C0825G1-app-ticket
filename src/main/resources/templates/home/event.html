<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám phá Sự kiện - EventPro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <th:block th:replace="~{common/styles :: styles}"></th:block>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{common/header :: public-navbar-dark}"></div>

    <!-- Breadcrumb & Page Title -->
    <section class="mt-5 pt-5 py-4 bg-light border-bottom">
        <div class="container-xl">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Sự kiện</li>
                </ol>
            </nav>
            <h1 class="display-6 fw-bold mb-0">Khám phá Sự kiện</h1>
        </div>
    </section>

    <!-- Main Content -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <!-- Left Sidebar - Filters -->
                <div class="col-lg-3 mb-4">
                    <div class="sticky-top" style="top: 100px;">
                        <!-- Filter Form -->
                        <form method="get" th:action="@{/event/search}" id="filterForm">
                            <!-- Search Box -->
                            <div class="mb-4">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="bi bi-search text-muted"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0 ps-0"
                                        placeholder="Tìm kiếm..." name="search"
                                        th:value="${param.search != null ? param.search[0] : ''}">
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary btn-sm flex-fill mt-2">
                                        <i class="bi bi-search me-1"></i> Tìm kiếm
                                    </button>
                                    <a th:href="@{/events}" class="btn btn-primary btn-sm flex-fill mt-2">
                                        <i class="bi bi-x-circle me-1"></i> Xóa
                                    </a>
                                </div>
                            </div>

                            <!-- Category Filter -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">Danh mục</h6>
                                <select class="form-select" name="category">
                                    <option value="" th:selected="${param.category == null}">Tất cả danh mục</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                        th:selected="${param.category != null and param.category[0] == cat.id.toString()}">
                                        Âm nhạc
                                    </option>
                                </select>
                            </div>

                            <!-- Location Filter -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">Địa điểm</h6>
                                <select class="form-select" name="location">
                                    <option value="" th:selected="${param.location == null}">Toàn quốc</option>

                                    <!-- Thành phố trực thuộc TW -->
                                    <option value="Hà Nội"
                                        th:selected="${param.location != null and param.location[0] == 'Hà Nội'}">Hà Nội
                                    </option>
                                    <option value="Hồ Chí Minh"
                                        th:selected="${param.location != null and param.location[0] == 'Hồ Chí Minh'}">
                                        TP. Hồ Chí Minh</option>
                                    <option value="Đà Nẵng"
                                        th:selected="${param.location != null and param.location[0] == 'Đà Nẵng'}">Đà
                                        Nẵng</option>
                                    <option value="Hải Phòng"
                                        th:selected="${param.location != null and param.location[0] == 'Hải Phòng'}">Hải
                                        Phòng</option>
                                    <option value="Cần Thơ"
                                        th:selected="${param.location != null and param.location[0] == 'Cần Thơ'}">Cần
                                        Thơ</option>

                                    <!-- Miền Bắc -->
                                    <option value="An Giang"
                                        th:selected="${param.location != null and param.location[0] == 'An Giang'}">An
                                        Giang</option>
                                    <option value="Bà Rịa - Vũng Tàu"
                                        th:selected="${param.location != null and param.location[0] == 'Bà Rịa - Vũng Tàu'}">
                                        Bà Rịa - Vũng Tàu</option>
                                    <option value="Bắc Giang"
                                        th:selected="${param.location != null and param.location[0] == 'Bắc Giang'}">Bắc
                                        Giang</option>
                                    <option value="Bắc Kạn"
                                        th:selected="${param.location != null and param.location[0] == 'Bắc Kạn'}">Bắc
                                        Kạn</option>
                                    <option value="Bạc Liêu"
                                        th:selected="${param.location != null and param.location[0] == 'Bạc Liêu'}">Bạc
                                        Liêu</option>
                                    <option value="Bắc Ninh"
                                        th:selected="${param.location != null and param.location[0] == 'Bắc Ninh'}">Bắc
                                        Ninh</option>
                                    <option value="Bến Tre"

                                    <option value="Bình Định"

                                        Bình Định</option>

                                        Bình Dương</option>

                                    <option value="Đắk Nông"
                                        th:selected="${param.location != null and param.location[0] == 'Đắk Nông'}">Đắk
                                        Nông</option>
                                    <option value="Điện Biên"
                                        th:selected="${param.location != null and param.location[0] == 'Điện Biên'}">
                                        Điện Biên</option>
                                    <option value="Đồng Nai"
                                        th:selected="${param.location != null and param.location[0] == 'Đồng Nai'}">Đồng
                                        Nai</option>
                                    <option value="Đồng Tháp"
                                        th:selected="${param.location != null and param.location[0] == 'Đồng Tháp'}">
                                        Đồng Tháp</option>
                                    <option value="Gia Lai"

                                    </option>
                                    <option value="Hà Tĩnh"
                                        th:selected="${param.location != null and param.location[0] == 'Hà Tĩnh'}">Hà
                                        Tĩnh</option>
                                    <option value="Hải Dương"
                                        th:selected="${param.location != null and param.location[0] == 'Hải Dương'}">Hải
                                        Dương</option>
                                    <option value="Hậu Giang"
                                        th:selected="${param.location != null and param.location[0] == 'Hậu Giang'}">Hậu
                                        Giang</option>
                                    <option value="Hòa Bình"
                                        th:selected="${param.location != null and param.location[0] == 'Hòa Bình'}">Hòa
                                        Bình</option>
                                    <option value="Hưng Yên"
                                        th:selected="${param.location != null and param.location[0] == 'Hưng Yên'}">Hưng
                                        Yên</option>
                                    <option value="Khánh Hòa"
                                        th:selected="${param.location != null and param.location[0] == 'Khánh Hòa'}">
                                        Khánh Hòa</option>
                                    <option value="Kiên Giang"

                                    <option value="Lai Châu"

                                    <option value="Lâm Đồng"

                                        Đồng</option>
                                    <option value="Lạng Sơn"
                                        th:selected="${param.location != null and param.location[0] == 'Lạng Sơn'}">Lạng

                                    <option value="Lào Cai"

                                    <option value="Long An"

                                    <option value="Nam Định"
                                        th:selected="${param.location != null and param.location[0] == 'Nam Định'}">Nam
                                        Định</option>
                                    <option value="Nghệ An"
                                        th:selected="${param.location != null and param.location[0] == 'Nghệ An'}">Nghệ
                                        An</option>
                                    <option value="Ninh Bình"
                                        th:selected="${param.location != null and param.location[0] == 'Ninh Bình'}">
                                        Ninh Bình</option>
                                    <option value="Ninh Thuận"
                                        th:selected="${param.location != null and param.location[0] == 'Ninh Thuận'}">
                                        Ninh Thuận</option>
                                    <option value="Phú Thọ"
                                        th:selected="${param.location != null and param.location[0] == 'Phú Thọ'}">Phú
                                        Thọ</option>
                                    <option value="Phú Yên"
                                        th:selected="${param.location != null and param.location[0] == 'Phú Yên'}">Phú
                                        Yên</option>
                                    <option value="Quảng Bình"
                                        th:selected="${param.location != null and param.location[0] == 'Quảng Bình'}">
                                        Quảng Bình</option>
                                    <option value="Quảng Nam"
                                        th:selected="${param.location != null and param.location[0] == 'Quảng Nam'}">

                                    <option value="Quảng Ngãi"
                                        th:selected="${param.location != null and param.location[0] == 'Quảng Ngãi'}">
                                        Quảng Ngãi</option>
                                    <option value="Quảng Ninh"
                                        th:selected="${param.location != null and param.location[0] == 'Quảng Ninh'}">
                                        Quảng Ninh</option>
                                    <option value="Quảng Trị"
                                        th:selected="${param.location != null and param.location[0] == 'Quảng Trị'}">
                                        Quảng Trị</option>
                                    <option value="Sóc Trăng"
                                        th:selected="${param.location != null and param.location[0] == 'Sóc Trăng'}">Sóc
                                        Trăng</option>
                                    <option value="Sơn La"
                                        th:selected="${param.location != null and param.location[0] == 'Sơn La'}">Sơn La
                                    </option>
                                    <option value="Tây Ninh"
                                        th:selected="${param.location != null and param.location[0] == 'Tây Ninh'}">Tây
                                        Ninh</option>
                                    <option value="Thái Bình"
                                        th:selected="${param.location != null and param.location[0] == 'Thái Bình'}">
                                        Thái Bình</option>
                                    <option value="Thái Nguyên"
                                        th:selected="${param.location != null and param.location[0] == 'Thái Nguyên'}">
                                        Thái Nguyên</option>
                                    <option value="Thanh Hóa"
                                        th:selected="${param.location != null and param.location[0] == 'Thanh Hóa'}">
                                        Thanh Hóa</option>
                                    <option value="Thừa Thiên Huế"
                                        th:selected="${param.location != null and param.location[0] == 'Thừa Thiên Huế'}">
                                        Thừa Thiên Huế</option>
                                    <option value="Tiền Giang"
                                        th:selected="${param.location != null and param.location[0] == 'Tiền Giang'}">
                                        Tiền Giang</option>
                                    <option value="Trà Vinh"
                                        th:selected="${param.location != null and param.location[0] == 'Trà Vinh'}">Trà
                                        Vinh</option>
                                    <option value="Tuyên Quang"
                                        th:selected="${param.location != null and param.location[0] == 'Tuyên Quang'}">
                                        Tuyên Quang</option>
                                    <option value="Vĩnh Long"
                                        th:selected="${param.location != null and param.location[0] == 'Vĩnh Long'}">
                                        Vĩnh Long</option>
                                    <option value="Vĩnh Phúc"
                                        th:selected="${param.location != null and param.location[0] == 'Vĩnh Phúc'}">
                                        Vĩnh Phúc</option>
                                    <option value="Yên Bái"
                                        th:selected="${param.location != null and param.location[0] == 'Yên Bái'}">Yên
                                        Bái</option>
                                </select>
                            </div>

                            <!-- Hidden field to preserve page on filter change -->
                            <input type="hidden" name="page" value="0">

                            <!-- NO TIME FILTER per requirement -->
                        </form>
                    </div>
                </div>

                <!-- Right Content - Events List -->
                <div class="col-lg-9">
                    <!-- Results Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <p class="text-muted mb-0">
                                Tìm thấy <strong th:text="${events != null ? events.totalElements : 0}">24</strong> sự
                                kiện
                            </p>
                        </div>
                    </div>

                    <!-- Events List (using fragment) -->
                    <div th:replace="~{home/event_fragment :: eventList(${events})}"></div>

                    <!-- Sidebar sự kiện gần -->
                    <div class="mt-5">
                        <div class="mb-4">
                            <h4 class="fw-bold mb-1">
                                <i class="bi bi-geo-fill text-primary"></i>
                                Sự kiện gần bạn
                            </h4>
                            <p class="text-muted mb-0"
                                th:if="${param.location != null and !param.location[0].isEmpty()}">
                                Sự kiện gần <strong th:text="${param.location[0]}">địa điểm</strong>
                            </p>
                            <p class="text-muted mb-0" th:if="${param.location == null or param.location[0].isEmpty()}">
                                Vui lòng chọn địa điểm để xem sự kiện gần bạn
                            </p>
                        </div>
                        <!-- Danh sách sự kiện theo hàng ngang -->
                        <div th:if="${nearbyEvents != null and !nearbyEvents.isEmpty()}">
                            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
                                <div th:each="event : ${nearbyEvents}" class="col">
                                    <div class="card h-100 shadow-sm nearby-event-card"
                                        th:onclick="'window.location.href=\'/event/' + ${event.id} + '\''"
                                        style="cursor: pointer; transition: transform 0.2s;">
                                        <!-- Hình ảnh sự kiện -->
                                        <img th:src="${event.image != null and !event.image.isEmpty()} ? ${event.image} : 'https://via.placeholder.com/300x200'"
                                            th:alt="${event.title}" class="card-img-top"
                                            style="height: 150px; object-fit: cover;">

                                        <!-- Nội dung -->
                                        <div class="card-body p-3">
                                            <h6 class="fw-bold mb-2 text-truncate" th:text="${event.title}">Event Title
                                            </h6>

                                            <p class="mb-2 small text-muted">
                                                <i class="bi bi-geo-alt-fill text-primary"></i>
                                                <span th:text="${event.location}">Location</span>
                                            </p>

                                            <div class="d-flex gap-1 flex-wrap mb-2">
                                                <span class="badge bg-success">
                                                    <i class="bi bi-pin-map-fill"></i>
                                                    <span
                                                        th:text="${#numbers.formatDecimal(event.distance, 1, 1)} + ' km'">0.0
                                                        km</span>
                                                </span>
                                                <span th:if="${event.categoryName != null}" class="badge bg-secondary"
                                                    th:text="${event.categoryName}">Category</span>
                                            </div>

                                            <!-- Occurrence count with toggle -->
                                            <div th:if="${event.occurrences != null and !event.occurrences.isEmpty()}"
                                                class="occurrence-section mt-2 pt-2 border-top">
                                                <!-- Clickable summary -->
                                                <p class="small mb-0" style="cursor: pointer;"
                                                    th:data-bs-toggle="'collapse'"
                                                    th:data-bs-target="'#occurrences-' + ${event.id}">
                                                    <i class="bi bi-calendar-event text-primary"></i>
                                                    <span class="fw-semibold"
                                                        th:text="${event.occurrences.size()} + ' suất diễn'">3 suất
                                                        diễn</span>
                                                    <i class="bi bi-chevron-down text-muted ms-1"
                                                        style="font-size: 0.7rem;"></i>
                                                    <small class="text-muted ms-1">(click xem chi tiết)</small>
                                                </p>

                                                <!-- Collapsible occurrence list
                                                <div class="collapse" th:id="'occurrences-' + ${event.id}">
                                                    <div class="occurrence-items mt-2"
                                                        style="max-height: 120px; overflow-y: auto;">
                                                        <div th:each="occ, iterStat : ${event.occurrences}"
                                                            class="occurrence-item small mb-1 pb-1"
                                                            th:classappend="${!iterStat.last} ? 'border-bottom' : ''">
                                                            <div class="d-flex align-items-start gap-1">
                                                                <i class="bi bi-clock text-primary mt-1"
                                                                    style="font-size: 0.75rem;"></i>
                                                                <div class="flex-grow-1">
                                                                    <div class="fw-semibold"
                                                                        th:text="${#temporals.format(occ.eventDate, 'dd/MM/yyyy HH:mm')}">
                                                                        25/01/2026 19:00
                                                                    </div>
                                                                    <div class="text-muted" style="font-size: 0.7rem;"
                                                                        th:text="${occ.addressDetail}">
                                                                        Địa chỉ chi tiết
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div> -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Không có sự kiện -->
                        <div th:if="${nearbyEvents == null or nearbyEvents.isEmpty()}" class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            Không có sự kiện nào < 200km ở gần bạn </div>
                        </div>

    <footer th:replace="~{common/footer :: footer-dark}"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
