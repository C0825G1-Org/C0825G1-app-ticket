<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Không có quyền truy cập</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            max-width: 500px;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.5s ease-out;
        }

        .icon-circle {
            width: 100px;
            height: 100px;
            background: #fef2f2;
            color: #ef4444;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            color: #1e293b;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
        }

        .btn-home {
            background: #0f172a;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-home:hover {
            background: #334155;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="error-card mx-auto">
            <div class="icon-circle">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <div class="error-code">403</div>
            <h2 class="fw-bold mb-3">Quyền truy cập bị từ chối</h2>
            <p class="text-muted mb-4 fs-5">
                Xin lỗi, bạn không có quyền truy cập vào trang này.
            </p>

            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/}" class="btn btn-home text-decoration-none">
                    <i class="bi bi-house-door me-2"></i>Trang chủ
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                    Quay lại
                </a>
            </div>
        </div>
    </div>

</body>

</html>
